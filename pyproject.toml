[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turnitoff"
version = "0.1.0"
description = "Keeps AI-written prose from sounding like a template: a writing rule, a scanner, an MCP server and a Claude Code hook."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.scripts]
turnitoff = "turnitoff.cli:main"
turnitoff-mcp = "turnitoff.mcp_server:main"

[tool.setuptools]
packages = ["turnitoff"]

[tool.setuptools.package-data]
turnitoff = ["data/*.md"]
